name: CI

# The Rust workspace (core, memory, group, ratatui, FFI with its C smoke
# test, wasm bridge) and the web adapter under web/.
# End-to-end tests run in full (every browser) on main, nightly, by hand,
# and on a PR labelled `full-e2e`. Other PRs run Chromium only, and only
# when the change can reach the web adapter.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      e2e: ${{ steps.plan.outputs.e2e }}
      projects: ${{ steps.plan.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
      # Everything but the crates and files the web adapter never builds, so
      # a new crate counts as web-facing until it is listed here.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            web:
              - "**"
              - "!crates/binnacle-ratatui/**"
              - "!crates/binnacle-ffi/**"
              - "!docs/**"
              - "!**/*.md"
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'full-e2e') }}
          WEB: ${{ steps.filter.outputs.web }}
        run: |
          if [ "$EVENT" != pull_request ] || [ "$FULL" = true ]; then
            echo 'projects=["chromium","firefox","webkit"]' >> "$GITHUB_OUTPUT"
            echo e2e=true >> "$GITHUB_OUTPUT"
          else
            echo 'projects=["chromium"]' >> "$GITHUB_OUTPUT"
            echo "e2e=$WEB" >> "$GITHUB_OUTPUT"
          fi

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Hegel property tests draw fresh cases each run; examples they save
      # under .hegel/ stay on the runner.
      - run: cargo test --workspace --locked --no-fail-fast

  web:
    name: Web
    runs-on: ubuntu-latest
    needs: fmt
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: E2E / ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: [fmt, changes]
    if: needs.changes.outputs.e2e == 'true'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.changes.outputs.projects) }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.project }}
      - run: pnpm build
      # Screenshot baselines are taken on macOS (*-darwin.png), so CI skips
      # pixel comparisons; they stay a local gate.
      - run: pnpm exec playwright test --project ${{ matrix.project }} --ignore-snapshots
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.project }}
          path: web/test-results/
          if-no-files-found: ignore
