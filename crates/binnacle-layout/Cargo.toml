[package]
name = "binnacle-layout"
description = "The portable Layout document for binnacle: a table's presentation, as JSON or CBOR"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
binnacle-core.workspace = true
ciborium = "0.2"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
binnacle-memory.workspace = true
binnacle-testkit.workspace = true
hegeltest.workspace = true
