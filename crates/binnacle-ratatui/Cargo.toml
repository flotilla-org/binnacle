[package]
name = "binnacle-ratatui"
description = "ratatui adapter and demo for the binnacle Grid"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# `CliTable` for a Described Table.
described = ["dep:binnacle-described"]
# A ready-made `clap` argument group for the CLI flags.
clap = ["dep:clap"]

[dependencies]
binnacle-core.workspace = true
binnacle-described = { workspace = true, optional = true }
binnacle-format.workspace = true
binnacle-group.workspace = true
binnacle-layout.workspace = true
binnacle-memory.workspace = true
clap = { version = "4", features = ["derive"], optional = true }
regex.workspace = true
ratatui.workspace = true
serde_json.workspace = true
unicode-width.workspace = true

[target.'cfg(unix)'.dependencies]
# Restores the terminal on SIGINT, SIGTERM and SIGHUP in the inline table.
signal-hook = "0.3"

[dev-dependencies]
binnacle-testkit.workspace = true
hegeltest.workspace = true
insta.workspace = true
