# PROTOTYPE (#45): throwaway wasm bridge over binnacle-core. Its own
# workspace so `cargo test --workspace` at the repo root never sees it.
[workspace]

[package]
name = "binnacle-web-proto"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
binnacle-core = { path = "../../../crates/binnacle-core" }
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
